services:
  postgres:
    image: postgres:18.4-trixie@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    environment:
      POSTGRES_DB: vikunjbot_test
      POSTGRES_USER: vikunjbot_test
      POSTGRES_PASSWORD: vikunjbot_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [test]

  tests:
    profiles: ["test"]
    image: vikunjbot-test:local
    build:
      context: .
      target: test
    command: ["uv", "run", "pytest"]
    environment:
      VIKUNJBOT_TEST_DATABASE_URL: postgresql+psycopg://vikunjbot_test:vikunjbot_test@postgres:5432/vikunjbot_test
      VIKUNJBOT_TEST_MAINTENANCE_DATABASE: postgres
      VIKUNJBOT_TEST_DROP_DATABASE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [test]

networks:
  test:
    internal: true
