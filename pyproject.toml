[project]
name = "vikunjbot"
version = "0.1.0"
description = "Reliable Vikunja-to-Telegram event relay and bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.24,<4",
    "cryptography>=46,<47",
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.12,<3",
    "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
vikunjbot-relay = "vikunjbot.relay:main"
vikunjbot = "vikunjbot.bot:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunjbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
